name: Build Reopen Drafts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package XPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Validate extension
        run: npm run check

      # Backstop for the pre-commit hook: re-sync manifest.json to package.json
      # and warn (but do not fail) if the checked-in manifest was stale, e.g.
      # because a commit was made with the hook bypassed. The package step below
      # always zips a manifest that matches package.json.
      - name: Sync manifest version (backstop)
        run: |
          if ! npm run sync-version -- --check; then
            echo "::warning::Checked-in manifest.json was out of sync with package.json; re-synced it for this build. Run 'npm run setup' locally so the pre-commit hook keeps them in lockstep."
            npm run sync-version
          fi

      - name: Package extension
        run: npm run package

      - name: Audit public package inputs
        run: npm run audit:public

      - name: Upload XPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reopen-drafts-xpi
          path: dist/reopen-drafts.xpi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      # The release tag is the single source of truth for a release's version.
      # If it disagrees with package.json, correct package.json (and the derived
      # manifest.json), commit the correction, and move the tag onto that commit
      # so the tag always covers a tree whose version matches it.
      - name: Align version with release tag
        run: |
          set -e
          # Export so the node one-liner below can read it via process.env
          # (a bare shell variable is not visible to child processes).
          export TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} matches package.json; nothing to do."
            exit 0
          fi
          echo "Tag v${TAG_VERSION} != package.json ${PKG_VERSION}; aligning package.json to the tag."
          # Surgical single-line edit so the rest of package.json is untouched.
          # The shell string is single-quoted, so bash passes the JS verbatim:
          # no \" escapes for YAML to strip, no bare " to break quoting, and
          # $1 stays a literal regex backreference. The JSON quotes around the
          # new version are built at runtime with String.fromCharCode(34).
          node -e 'const f="package.json";const fs=require("fs");const q=String.fromCharCode(34);fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/("version":\s*)"[^"]+"/,"$1"+q+process.env.TAG_VERSION+q))'
          npm run sync-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "Align version with release tag v${TAG_VERSION}"
          git tag -f "v${TAG_VERSION}"
          # Force: the tag may already point at an earlier commit (e.g. after a
          # re-tag), and a non-force push would be rejected.
          git push --force origin "v${TAG_VERSION}"

      # The alignment step above rewrote package.json and manifest.json to the
      # tag's version and committed that. The working tree now carries the
      # correct version, so build the XPI directly from it — no need to
      # download (and risk clobbering with a stale) artifact from the build
      # job, which packaged the tag's original, pre-alignment commit.
      - name: Package XPI with aligned version
        run: |
          set -e
          echo "Syncing manifest.json and packaging so the XPI carries version ${GITHUB_REF_NAME#v}."
          npm run sync-version
          npm run package

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum reopen-drafts.xpi | awk '{print $1"  reopen-drafts.xpi"}' > reopen-drafts.xpi.sha256

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/reopen-drafts.xpi
            dist/reopen-drafts.xpi.sha256
