name: Build Reopen Drafts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package XPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Audit public package inputs
        run: npm run audit:public

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: reopen-drafts-xpi
          path: dist/reopen-drafts.xpi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download XPI artifact
        uses: actions/download-artifact@v4
        with:
          name: reopen-drafts-xpi
          path: dist

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum reopen-drafts.xpi | awk '{print $1"  reopen-drafts.xpi"}' > reopen-drafts.xpi.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reopen-drafts.xpi
            dist/reopen-drafts.xpi.sha256
